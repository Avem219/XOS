
      - name: Validate repository (shell, XML, YAML, assets, package list, apt availability)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bash ./scripts/validate.sh --packages 2>&1 | tee out/validate.log

      - name: Build ISO
        shell: bash
        run: |
          set -euo pipefail
          bash ./build-xos.sh

      - name: Check ISO output
        shell: bash
        run: |
          set -euo pipefail
          test -s out/XOS-Alpha-amd64.iso
          ls -l out/XOS-Alpha-amd64.iso
          cat out/XOS-Alpha-amd64.iso.sha256
          cd out
          sha256sum -c XOS-Alpha-amd64.iso.sha256
          xorriso -indev XOS-Alpha-amd64.iso -report_el_torito as_mkisofs > boot-info.txt 2>&1
          head -30 boot-info.txt

      - name: QEMU UEFI boot smoke test (software emulation, may be slow; failure does not block the ISO)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          bash ./scripts/qemu-smoke.sh out/XOS-Alpha-amd64.iso 420 out/qemu 2>&1 | tee out/qemu-smoke.log
