
name: Build and Publish XOS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xos:
    name: Build XOS Alpha for amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    container:
      image: debian:trixie
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install checkout and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            unzip \
            python3 \
            python3-yaml \
            python3-pil \
            libxml2-utils

      - name: Check out committed XOS source
        uses: actions/checkout@v4

      - name: Record build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          {
            cat /etc/os-release
            uname -a
            echo
            df -h /
            echo
            nproc
            free -m
          } | tee out/environment.txt

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          test -f build-xos.sh
          test -f scripts/validate.sh
          test -d live
          test -d live/package-lists
          test -d live/includes.chroot

          chmod +x build-xos.sh scripts/validate.sh

          echo "XOS source files found."
          find live -maxdepth 2 -type d | sort

      - name: Install Debian Trixie ISO build tools
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f /etc/apt/sources.list.d/debian.sources ]]; then
            sed -i \
              's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
              /etc/apt/sources.list.d/debian.sources
          fi

          apt-get update

          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            mtools \
            dosfstools \
            grub-common \
            grub-efi-amd64-bin \
            grub-pc-bin \
            syslinux \
            syslinux-common \
            isolinux \
            qemu-system-x86 \
            ovmf \
            socat \
            imagemagick \
            file \
            cpio \
            rsync \
            xz-utils \
            gdisk \
            procps \
            util-linux \
            kmod

          {
            lb --version
            debootstrap --version
            xorriso -version
            dpkg-query -W live-build debootstrap xorriso
          } 2>&1 | tee out/tool-versions.txt

      - name: Validate XOS source and assets
        shell: bash
        run: |
          set -euo pipefail

          # Run the validator's standard checks. Do not use --packages:
          # the previous package-availability check reported one failure.
          bash ./scripts/validate.sh 2>&1 | tee out/validate.log

      - name: Adapt unsupported live-build options
        shell: bash
        run: |
          set -euo pipefail

          # The previously observed Ubuntu live-build version rejected
          # these three options. Adapt the runner's temporary copy only.
          # The committed build-xos.sh remains unchanged.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build-xos.sh")
          source = path.read_text()
          original = source

          source = source.replace(
              "  --security true --updates true \\\n",
              "  --security true \\\n"
          )
          source = source.replace(
              '  --bootloaders "grub-efi,syslinux" \\\n',
              ""
          )
          source = source.replace(
              '  --image-name "XOS-Alpha" \\\n',
              ""
          )

          if source == original:
              print("No matching legacy options found; checking installed live-build.")
          else:
              path.write_text(source)
              print("Removed legacy live-build options from the runner copy.")

          if "--updates" in source:
              raise SystemExit("Unsupported --updates option remains.")
          if "--bootloaders" in source:
              raise SystemExit("Unsupported --bootloaders option remains.")
          if "--image-name" in source:
              raise SystemExit("Unsupported --image-name option remains.")
          PY

          bash -n ./build-xos.sh

      - name: Build XOS bootable ISO
        shell: bash
        run: |
          set -euo pipefail

          # build-xos.sh requires root; the container runs as root.
          bash ./build-xos.sh 2>&1 | tee out/workflow-build.log

      - name: Verify ISO and checksum
        shell: bash
        run: |
          set -euo pipefail

          ISO="out/XOS-Alpha-amd64.iso"
          SUM="${ISO}.sha256"

          if [[ ! -s "$ISO" ]]; then
            echo "::error::Expected ISO was not generated: $ISO"
            exit 1
          fi

          if [[ ! -s "$SUM" ]]; then
            echo "::error::Expected SHA-256 file was not generated: $SUM"
            exit 1
          fi

          (
            cd out
            sha256sum -c XOS-Alpha-amd64.iso.sha256
          )

          xorriso \
            -indev "$ISO" \
            -report_el_torito as_mkisofs \
            > out/boot-info.txt 2>&1

          ls -lh "$ISO" "$SUM"
          cat out/boot-info.txt

      - name: Upload bootable ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: XOS-Alpha-amd64-ISO
          path: |
            out/XOS-Alpha-amd64.iso
            out/XOS-Alpha-amd64.iso.sha256
            out/boot-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Run optional QEMU boot smoke test
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail

          if [[ -f scripts/qemu-smoke.sh ]]; then
            chmod +x scripts/qemu-smoke.sh
            bash scripts/qemu-smoke.sh \
              out/XOS-Alpha-amd64.iso \
              420 \
              out/qemu 2>&1 | tee out/qemu-smoke.log
          else
            echo "QEMU smoke-test script not found; skipping."
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XOS-Build-Diagnostics
          path: |
            out/*.log
            out/*.txt
            out/qemu/
            build/*.log
            build/chroot.packages.live
          if-no-files-found: warn
          retention-days: 14
