
name: Extract, Build and Publish XOS ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-commit-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract XOS source into repository root
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$(find . -type f -name 'xos-source.zip' \
            -not -path './.git/*' -print -quit)"

          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::xos-source.zip was not found."
            exit 1
          fi

          echo "Checking archive: $ZIP_PATH"
          unzip -t "$ZIP_PATH"

          # Keep workflow definitions unchanged.
          unzip -o "$ZIP_PATH" -d . \
            -x '.github/workflows/*' \
               '.github/workflows/**'

          if [[ ! -f build-xos.sh ]]; then
            echo "::error::build-xos.sh must be at repository root."
            find . -type f -name 'build-xos.sh' \
              -not -path './.git/*' -print
            exit 1
          fi

          echo "XOS source extracted."

      - name: Commit and push extracted source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . \
            ':!.git' \
            ':!xos-source.zip' \
            ':!.github/workflows' \
            ':!*.iso' \
            ':!**/*.iso'

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Extract XOS source into repository root"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install XOS ISO build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
              live-build \
              debootstrap \
              squashfs-tools \
              xorriso \
              isolinux \
              syslinux-common \
              grub-pc-bin \
              grub-efi-amd64-bin \
              grub-efi-ia32-bin \
              dosfstools \
              mtools \
              xz-utils \
              rsync \
              ca-certificates \
              curl \
              git \
              file \
              cpio \
              gdisk

          echo "Checking build tools..."
          lb --version
          debootstrap --version
          xorriso -version

      - name: Validate XOS source
        shell: bash
        run: |
          set -euo pipefail

          test -f build-xos.sh
          test -d live
          test -d scripts

          if [[ -f scripts/validate.sh ]]; then
            bash scripts/validate.sh
          else
            echo "No scripts/validate.sh found; basic checks passed."
          fi

      - name: Build XOS bootable ISO
        shell: bash
        run: |
          set -euo pipefail

          sudo bash ./build-xos.sh

      - name: Locate and verify generated ISO
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/iso

          ISO_PATH="$(find . -type f -iname '*.iso' \
            -not -path './.git/*' \
            -not -path './out/iso/*' \
            -print -quit)"

          if [[ -z "$ISO_PATH" ]]; then
            echo "::error::No ISO was generated."
            echo "Review the build step logs."
            exit 1
          fi

          echo "Generated ISO: $ISO_PATH"
          test -s "$ISO_PATH"

          cp "$ISO_PATH" out/iso/XOS-Alpha-amd64.iso

          sha256sum out/iso/XOS-Alpha-amd64.iso \
            | tee out/iso/SHA256SUMS.txt

          ls -lh out/iso/

      - name: Upload XOS ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: XOS-Alpha-amd64-ISO
          path: out/iso/
          if-no-files-found: error
          retention-days: 14
