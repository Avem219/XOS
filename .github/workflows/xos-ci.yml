
name: Extract XOS ZIP to Repository Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract archive into repository root
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$(find . -type f -name 'xos-source.zip' \
            -not -path './.git/*' -print -quit)"

          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::xos-source.zip not found."
            exit 1
          fi

          echo "Archive: $ZIP_PATH"
          unzip -t "$ZIP_PATH"

          # Extract into the repository root.
          # Existing files may be overwritten by matching archive paths.
          unzip -o "$ZIP_PATH" -d .

          echo "Root files after extraction:"
          ls -la

          echo "Build script locations:"
          find . -type f -name 'build-xos.sh' \
            -not -path './.git/*' -print

          if [[ ! -f build-xos.sh ]]; then
            echo "::error::build-xos.sh is not at the repository root."
            echo "The ZIP may contain an enclosing directory."
            echo "Inspect the file locations above before changing paths."
            exit 1
          fi

      - name: Commit extracted files to repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not add the archive or Git metadata.
          git add -A -- . ':!.git' ':!xos-source.zip'

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract XOS source into repository root"
          git push origin "HEAD:${GITHUB_REF_NAME}"

