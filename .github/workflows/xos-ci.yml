
name: Build and Publish XOS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xos:
    name: Build XOS Alpha amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    container:
      image: debian:trixie
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install checkout prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git unzip

      - name: Check out committed XOS source
        uses: actions/checkout@v4

      - name: Record build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          {
            cat /etc/os-release
            echo
            uname -a
            echo
            df -h /
            echo
            echo "CPU cores: $(nproc)"
            if command -v free >/dev/null 2>&1; then
              free -m
            elif [[ -r /proc/meminfo ]]; then
              grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo
            else
              echo "Memory information unavailable."
            fi
          } 2>&1 | tee out/environment.txt

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail
          test -f build-xos.sh
          test -f scripts/validate.sh
          test -d live
          chmod +x build-xos.sh scripts/validate.sh
          echo "Required XOS source files found."

      - name: Install ISO build dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f /etc/apt/sources.list.d/debian.sources ]]; then
            sed -i \
              's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
              /etc/apt/sources.list.d/debian.sources
          fi

          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            mtools \
            dosfstools \
            grub-common \
            grub-efi-amd64-bin \
            grub-pc-bin \
            syslinux \
            syslinux-common \
            isolinux \
            qemu-system-x86 \
            ovmf \
            socat \
            imagemagick \
            file \
            cpio \
            rsync \
            xz-utils \
            gdisk \
            procps \
            util-linux \
            kmod

          {
            lb --version
            debootstrap --version
            xorriso -version
          } 2>&1 | tee out/tool-versions.txt

      - name: Validate source and assets
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/validate.sh 2>&1 | tee out/validate.log

      - name: Adapt legacy live-build options
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("build-xos.sh")
          source = path.read_text()

          replacements = [
              ("  --security true --updates true \\\n",
               "  --security true \\\n"),
              ('  --bootloaders "grub-efi,syslinux" \\\n', ""),
              ('  --image-name "XOS-Alpha" \\\n', ""),
          ]

          for old, new in replacements:
              source = source.replace(old, new)

          for option in ("--updates", "--bootloaders", "--image-name"):
              if option in source:
                  raise SystemExit(
                      f"Unsupported live-build option remains: {option}"
                  )

          path.write_text(source)
          print("Temporary runner copy checked.")
          PY

          bash -n ./build-xos.sh

      - name: Build XOS ISO
        shell: bash
        run: |
          set -euo pipefail
          bash ./build-xos.sh 2>&1 | tee out/workflow-build.log

      - name: Verify ISO and checksum
        shell: bash
        run: |
          set -euo pipefail

          ISO="out/XOS-Alpha-amd64.iso"
          SUM="${ISO}.sha256"

          test -s "$ISO" || {
            echo "::error::ISO was not created at $ISO"
            exit 1
          }

          if [[ ! -s "$SUM" ]]; then
            echo "::error::Checksum file not found: $SUM"
            exit 1
          fi

          (
            cd out
            sha256sum -c XOS-Alpha-amd64.iso.sha256
          )

          xorriso -indev "$ISO" \
            -report_el_torito as_mkisofs \
            > out/boot-info.txt 2>&1

          ls -lh "$ISO" "$SUM"
          cat out/boot-info.txt

      - name: Upload XOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: XOS-Alpha-amd64-ISO
          path: |
            out/XOS-Alpha-amd64.iso
            out/XOS-Alpha-amd64.iso.sha256
            out/boot-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Optional QEMU boot smoke test
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          if [[ -f scripts/qemu-smoke.sh ]]; then
            bash scripts/qemu-smoke.sh \
              out/XOS-Alpha-amd64.iso \
              420 \
              out/qemu 2>&1 | tee out/qemu-smoke.log
          else
            echo "QEMU smoke-test script not found; skipped."
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XOS-Build-Diagnostics
          path: |
            out/*.log
            out/*.txt
            out/qemu/
          if-no-files-found: warn
          retention-days: 14
