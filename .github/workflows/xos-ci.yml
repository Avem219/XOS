
name: Extract XOS ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Extract XOS source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and extract XOS ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for xos-source.zip..."

          ZIP_PATH="$(find . -type f -name 'xos-source.zip' \
            -not -path './.git/*' -print -quit)"

          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::xos-source.zip was not found."
            echo "Files available in repository:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "Found archive: $ZIP_PATH"

          mkdir -p extracted-xos

          unzip -t "$ZIP_PATH"
          unzip -o "$ZIP_PATH" -d extracted-xos

          echo "Extraction complete."
          echo "Extracted file listing:"
          find extracted-xos -maxdepth 5 -type f | sort | head -500

          if [[ ! -f extracted-xos/build-xos.sh ]] &&
             [[ ! -f extracted-xos/xos-source/build-xos.sh ]]; then
            echo "::warning::Build script was not found at the expected archive paths. Check the extracted file listing."
          fi

      - name: Upload extracted XOS files
        uses: actions/upload-artifact@v4
        with:
          name: xos-extracted-source
          path: extracted-xos/
          if-no-files-found: error
          retention-days: 7
