
name: Extract, Build and Publish XOS ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-commit-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract XOS source into repository root
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$(find . -type f -name 'xos-source.zip' \
            -not -path './.git/*' -print -quit)"

          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::xos-source.zip was not found."
            exit 1
          fi

          echo "Checking archive: $ZIP_PATH"
          unzip -t "$ZIP_PATH"

          # Extract source files but preserve workflow definitions.
          unzip -o "$ZIP_PATH" -d . \
            -x '.github/workflows/*' \
               '.github/workflows/**'

          echo "Checking extracted build script..."
          find . -type f -name 'build-xos.sh' \
            -not -path './.git/*' -print

          if [[ ! -f build-xos.sh ]]; then
            echo "::error::build-xos.sh is not in the repository root."
            echo "The archive may contain an enclosing directory."
            exit 1
          fi

          echo "XOS source extraction completed."

      - name: Commit and push extracted source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . \
            ':!.git' \
            ':!xos-source.zip' \
            ':!.github/workflows' \
            ':!*.iso' \
            ':!**/*.iso'

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Extract XOS source into repository root"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check XOS build prerequisites
        shell: bash
        run: |
          set -euo pipefail

          test -f build-xos.sh
          test -d live
          test -d scripts

          echo "Build script and expected source directories found."
          bash --version | head -n 1

      - name: Build XOS bootable ISO
        shell: bash
        run: |
          set -euo pipefail

          # The build may need root privileges for live-build
          # and system package operations.
          sudo bash ./build-xos.sh

      - name: Find and prepare the ISO artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/iso

          ISO_PATH="$(find . -type f -iname '*.iso' \
            -not -path './.git/*' \
            -not -path './out/iso/*' \
            -print -quit)"

          if [[ -z "$ISO_PATH" ]]; then
            echo "::error::The build finished without producing an ISO."
            echo "Inspect the build logs to identify the failure."
            exit 1
          fi

          echo "ISO found: $ISO_PATH"

          cp "$ISO_PATH" out/iso/XOS-Alpha-amd64.iso

          echo "ISO file details:"
          ls -lh out/iso/XOS-Alpha-amd64.iso
          sha256sum out/iso/XOS-Alpha-amd64.iso \
            | tee out/iso/SHA256SUMS.txt

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: XOS-Alpha-amd64-ISO
          path: out/iso/
          if-no-files-found: error
          retention-days: 14
