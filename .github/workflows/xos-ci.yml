
name: Extract, Build and Publish XOS ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xos:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract XOS source into repository root
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$(find . -type f -name 'xos-source.zip' \
            -not -path './.git/*' -print -quit)"

          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::xos-source.zip was not found."
            exit 1
          fi

          echo "Validating archive: $ZIP_PATH"
          unzip -t "$ZIP_PATH"

          # Do not overwrite the workflow currently running.
          unzip -o "$ZIP_PATH" -d . \
            -x '.github/workflows/*' \
               '.github/workflows/**'

          if [[ ! -f build-xos.sh ]]; then
            echo "::error::build-xos.sh is not at repository root."
            find . -type f -name 'build-xos.sh' \
              -not -path './.git/*' -print
            exit 1
          fi

          test -d live
          test -d scripts
          test -f scripts/validate.sh

          echo "XOS source extracted."

      - name: Fix shell script permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./build-xos.sh

          find ./scripts -type f -name '*.sh' \
            -exec chmod +x {} +

          echo "Shell script permissions updated."

      - name: Commit and push source files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . \
            ':!.git' \
            ':!xos-source.zip' \
            ':!**/xos-source.zip' \
            ':!.github/workflows' \
            ':!*.iso' \
            ':!**/*.iso'

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Extract XOS source and fix script permissions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install ISO build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
              live-build \
              debootstrap \
              squashfs-tools \
              xorriso \
              isolinux \
              syslinux-common \
              grub-pc-bin \
              grub-efi-amd64-bin \
              grub-efi-ia32-bin \
              dosfstools \
              mtools \
              xz-utils \
              rsync \
              ca-certificates \
              curl \
              git \
              file \
              cpio \
              gdisk

          echo "Installed build tools:"
          lb --version
          debootstrap --version
          xorriso -version

      - name: Validate XOS source
        shell: bash
        run: |
          set -euo pipefail

          # Use the package check only if the validator supports it.
          if bash ./scripts/validate.sh --help 2>&1 \
              | grep -q -- '--packages'; then
            bash ./scripts/validate.sh --packages
          else
            bash ./scripts/validate.sh
          fi

      - name: Build XOS bootable ISO
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p out
          set +e

          sudo bash ./build-xos.sh 2>&1 | tee out/build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            echo "::error::XOS build failed with exit code $BUILD_STATUS."
            exit "$BUILD_STATUS"
          fi

      - name: Locate and verify generated ISO
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/iso

          ISO_PATH="$(find . -type f -iname '*.iso' \
            -not -path './.git/*' \
            -not -path './out/iso/*' \
            -print -quit)"

          if [[ -z "$ISO_PATH" ]]; then
            echo "::error::No ISO was generated."
            exit 1
          fi

          if [[ ! -s "$ISO_PATH" ]]; then
            echo "::error::Generated ISO is empty."
            exit 1
          fi

          echo "Generated ISO: $ISO_PATH"

          cp "$ISO_PATH" out/iso/XOS-Alpha-amd64.iso

          sha256sum out/iso/XOS-Alpha-amd64.iso \
            | tee out/iso/SHA256SUMS.txt

          ls -lh out/iso/

      - name: Upload ISO and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XOS-Alpha-amd64-Build
          path: |
            out/iso/
            out/build.log
          if-no-files-found: warn
          retention-days: 14
