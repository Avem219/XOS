
name: Build XOS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    container:
      image: debian:trixie
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates unzip live-build debootstrap \
            squashfs-tools xorriso isolinux syslinux-common \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin \
            dosfstools mtools debian-archive-keyring \
            python3 python3-yaml python3-pil file rsync cpio \
            gzip bzip2 xz-utils zstd procps util-linux \
            coreutils findutils libxml2-utils

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and prepare XOS
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f xos-source.zip ]; then
            echo "ERROR: xos-source.zip is missing from repository root."
            exit 1
          fi

          mkdir -p _xos_unpack
          unzip -q -o xos-source.zip -d _xos_unpack

          SCRIPT="$(find _xos_unpack -type f -name build-xos.sh -print -quit)"
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: build-xos.sh was not found in the ZIP."
            find _xos_unpack -maxdepth 5 -type f -print | head -200
            exit 1
          fi

          ROOT="$(dirname "$SCRIPT")"
          cp -a "$ROOT"/. .
          rm -rf _xos_unpack

          test -f build-xos.sh
          test -f scripts/validate.sh

          PACKAGE_LIST="live/package-lists/xos.list.chroot"
          if [ -f "$PACKAGE_LIST" ]; then
            sed -i '/^[[:space:]]*firmware-brcm80211[[:space:]]*$/d' "$PACKAGE_LIST"
          fi

          echo "=== Splash image candidates ==="
          find . -type f -iname 'splash.png' -print

          if [ ! -f config/xos-boot/splash.png ]; then
            SOURCE_SPLASH=""

            for candidate in \
              live/bootloaders/splash.png \
              config/bootloaders/splash.png \
              live/config/xos-boot/splash.png; do
              if [ -f "$candidate" ]; then
                SOURCE_SPLASH="$candidate"
                break
              fi
            done

            if [ -z "$SOURCE_SPLASH" ]; then
              SOURCE_SPLASH="$(find . -type f -iname 'splash.png' -print -quit)"
            fi

            if [ -z "$SOURCE_SPLASH" ]; then
              echo "ERROR: No splash.png exists in the extracted XOS source."
              exit 1
            fi

            mkdir -p config/xos-boot
            cp "$SOURCE_SPLASH" config/xos-boot/splash.png
            echo "Staged $SOURCE_SPLASH as config/xos-boot/splash.png"
          fi

          test -s config/xos-boot/splash.png
          echo "XOS source and bootloader splash are ready."

      - name: Verify build tools
        run: |
          command -v lb
          command -v debootstrap
          command -v xorriso
          command -v xmllint

      - name: Validate XOS source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/validate.sh build-xos.sh
          mkdir -p out
          ./scripts/validate.sh --packages

      - name: Build XOS ISO
        shell: bash
        run: |
          set -o pipefail
          ./build-xos.sh 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xos-build-logs
          path: |
            build.log
            out/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload XOS ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xos-iso
          path: |
            *.iso
            out/*.iso
          if-no-files-found: warn
          retention-days: 7
          
