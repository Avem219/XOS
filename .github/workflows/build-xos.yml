
name: Build XOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'xos-source.zip'
      - 'live/**'
      - 'scripts/**'
      - 'build-xos.sh'
      - 'config/**'
      - '.github/workflows/build-xos.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    container:
      image: debian:trixie
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install bootstrap tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            unzip \
            python3 \
            python3-yaml \
            python3-pil \
            libxml2-utils \
            findutils \
            coreutils

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack XOS source archive
        shell: bash
        run: |
          set -euo pipefail

          if [ -f build-xos.sh ]; then
            echo "XOS build script already exists."
            exit 0
          fi

          if [ ! -f xos-source.zip ]; then
            echo "ERROR: Neither build-xos.sh nor xos-source.zip exists at the repository root."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          mkdir -p _xos_unpack
          unzip -q -o xos-source.zip -d _xos_unpack

          SOURCE_SCRIPT="$(find _xos_unpack -type f -name build-xos.sh -print -quit)"

          if [ -z "$SOURCE_SCRIPT" ]; then
            echo "ERROR: build-xos.sh was not found inside xos-source.zip."
            echo "Archive contents:"
            find _xos_unpack -maxdepth 5 -type f | head -150
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$SOURCE_SCRIPT")"
          cp -a "$SOURCE_ROOT"/. .
          rm -rf _xos_unpack

          if [ ! -f build-xos.sh ]; then
            echo "ERROR: Failed to place build-xos.sh at the repository root."
            exit 1
          fi

          echo "XOS source extracted successfully."
          ls -la

      - name: Make build scripts executable
        run: |
          chmod +x build-xos.sh
          if [ -f scripts/validate.sh ]; then
            chmod +x scripts/validate.sh
          fi

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/validate.sh ]; then
            mkdir -p out
            ./scripts/validate.sh --packages 2>&1 | tee out/validate.log
          else
            echo "ERROR: scripts/validate.sh is missing."
            exit 1
          fi

      - name: Build XOS ISO
        shell: bash
        run: |
          set -o pipefail
          ./build-xos.sh 2>&1 | tee out/build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xos-build-logs
          path: out/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload generated ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xos-iso
          path: |
            *.iso
            out/*.iso
          if-no-files-found: warn
          retention-days: 7
          
