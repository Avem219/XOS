
name: Inspect XOS Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Inspect and extract XOS ZIP
        shell: bash
        run: |
          set -eu

          echo "=== Repository root ==="
          pwd
          ls -la

          if [ ! -f xos-source.zip ]; then
            echo "ERROR: xos-source.zip is not in the repository root."
            echo "Searching repository for ZIP files..."
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "=== ZIP directory structure ==="
          unzip -Z1 xos-source.zip | head -200

          echo "=== Extracting archive ==="
          mkdir -p _xos_inspection
          unzip -q -o xos-source.zip -d _xos_inspection

          echo "=== Build and validation files ==="
          find _xos_inspection -type f \
            \( -name 'build-xos.sh' \
            -o -name 'validate.sh' \
            -o -name '0100-xos-bootloader.hook.binary' \
            -o -name 'splash.png' \) -print

          echo "=== Top-level extracted folders ==="
          find _xos_inspection -maxdepth 3 -type d -print | head -100

          echo "=== Package reference ==="
          grep -R -n 'firmware-brcm80211' _xos_inspection \
            --include='*.sh' --include='*.yml' --include='*.yaml' \
            --include='*.list' 2>/dev/null || true

          echo "Inspection complete. No ISO build attempted."
          
