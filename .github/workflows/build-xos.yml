
name: Build XOS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    container:
      image: debian:trixie
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y ca-certificates unzip python3

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract XOS source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f build-xos.sh ]; then
            test -f xos-source.zip || {
              echo "ERROR: xos-source.zip not found at repository root."
              exit 1
            }

            mkdir -p _xos_unpack
            unzip -q -o xos-source.zip -d _xos_unpack

            SCRIPT="$(find _xos_unpack -type f -name build-xos.sh -print -quit)"
            if [ -z "$SCRIPT" ]; then
              echo "ERROR: build-xos.sh not found in ZIP."
              find _xos_unpack -maxdepth 5 -type f | head -150
              exit 1
            fi

            ROOT="$(dirname "$SCRIPT")"
            cp -a "$ROOT"/. .
            rm -rf _xos_unpack
          fi

          test -f build-xos.sh
          test -f scripts/validate.sh

      - name: Report Broadcom firmware package references
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking references to firmware-brcm80211."
          grep -R -n 'firmware-brcm80211' . \
            --exclude-dir=.git --exclude='*.zip' || true

      - name: Build XOS
        shell: bash
        run: |
          set -o pipefail
          chmod +x build-xos.sh scripts/validate.sh
          ./build-xos.sh 2>&1 | tee build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xos-build-logs
          path: |
            build.log
            out/
          if-no-files-found: warn

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xos-iso
          path: |
            *.iso
            out/*.iso
          if-no-files-found: warn
          
