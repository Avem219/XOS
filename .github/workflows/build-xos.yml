
name: Build XOS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'xos-source.zip'
      - '.github/workflows/build-xos.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    container:
      image: debian:trixie
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            unzip \
            xz-utils \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin \
            dosfstools \
            mtools \
            debian-archive-keyring \
            python3 \
            python3-yaml \
            python3-pil \
            file \
            rsync \
            cpio \
            gzip \
            bzip2 \
            zstd \
            procps \
            util-linux \
            coreutils \
            findutils

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract XOS source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f build-xos.sh ]; then
            test -f xos-source.zip || {
              echo "ERROR: xos-source.zip not found in repository root."
              exit 1
            }

            mkdir -p _xos_unpack
            unzip -q -o xos-source.zip -d _xos_unpack

            SCRIPT="$(find _xos_unpack -type f -name build-xos.sh -print -quit)"
            if [ -z "$SCRIPT" ]; then
              echo "ERROR: build-xos.sh not found inside the ZIP."
              find _xos_unpack -maxdepth 5 -type f | head -150
              exit 1
            fi

            ROOT="$(dirname "$SCRIPT")"
            cp -a "$ROOT"/. .
            rm -rf _xos_unpack
          fi

          test -f build-xos.sh
          test -f scripts/validate.sh

      - name: Verify live-build installation
        run: |
          command -v lb
          lb --version
          command -v debootstrap
          command -v xorriso

      - name: Validate XOS source
        shell: bash
        run: |
          chmod +x scripts/validate.sh
          mkdir -p out
          ./scripts/validate.sh --packages

      - name: Build XOS ISO
        shell: bash
        run: |
          set -o pipefail
          chmod +x build-xos.sh
          ./build-xos.sh 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xos-build-logs
          path: |
            build.log
            out/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload XOS ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xos-iso
          path: |
            *.iso
            out/*.iso
          if-no-files-found: warn
          retention-days: 7
          
