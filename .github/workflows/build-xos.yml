name: Extract XOS ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository location:"
          pwd

          echo "Repository files:"
          find . -maxdepth 4 -type f -not -path './.git/*' | sort | head -300

          ZIP_PATH="$(find . -type f -iname 'xos-source.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Cannot find xos-source.zip in the checked-out repository."
            exit 1
          fi

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "Found: $ZIP_PATH"

      - name: Extract and verify
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/xos-extracted"

          unzip -t "$ZIP_PATH"
          unzip -o "$ZIP_PATH" -d "$RUNNER_TEMP/xos-extracted"

          COUNT="$(find "$RUNNER_TEMP/xos-extracted" -type f | wc -l)"
          echo "Extracted file count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::The ZIP contains no files."
            exit 1
          fi

          echo "First extracted files:"
          find "$RUNNER_TEMP/xos-extracted" -type f | sort | head -100

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: xos-extracted-source
          path: ${{ runner.temp }}/xos-extracted/
          if-no-files-found: error
          retention-days: 7
